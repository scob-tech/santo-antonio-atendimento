<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Entrar — Central de Atendimento · Grupo Santo Antônio</title>
<link rel="icon" type="image/png" href="/img/icon-192.png?v=casa2" />
<link rel="apple-touch-icon" href="/img/icon-192.png?v=casa2" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Design System da aplicação (tokens, ui-btn, ui-field) -->
<link rel="stylesheet" href="/scob.css?v=20260916s1" />
<style>
  /* Tela de login — só layout; cores, raios, sombras e componentes vêm do scob.css */
  :root {
    --login-panel: #0D2C5E; /* azul institucional do painel lateral */
  }

  body { min-height: 100vh; min-height: 100dvh; }

  .login {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* ---------- Painel esquerdo ---------- */
  .login-panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: var(--space-8) 72px;
    background: var(--login-panel);
    color: #fff;
  }
  .login-panel-inner { width: 100%; max-width: 440px; margin: 0 auto; }
  .login-panel-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-4) var(--space-6);
    margin-bottom: 40px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: 0 12px 32px -12px rgba(0, 0, 0, .35);
  }
  .login-panel-logo img { display: block; width: 168px; height: auto; }
  .login-panel h1 {
    margin: 0;
    font: 700 40px/1.1 var(--font-sans);
    letter-spacing: -.03em;
    color: #fff;
  }
  .login-panel .login-panel-setor {
    margin: var(--space-3) 0 0;
    font: 500 18px/1.3 var(--font-sans);
    color: rgba(255, 255, 255, .78);
    min-height: 23px;
  }
  .login-panel-divider {
    width: 56px;
    height: 3px;
    margin: var(--space-8) 0;
    border: none;
    border-radius: var(--radius-pill);
    background: var(--accent);
  }
  .login-panel p {
    margin: 0;
    max-width: 380px;
    font: 400 15px/1.6 var(--font-sans);
    color: rgba(255, 255, 255, .72);
  }

  /* ---------- Lado direito ---------- */
  .login-side {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-8) var(--space-6);
    background: var(--app-bg);
  }
  .login-card {
    width: 100%;
    max-width: 420px;
    padding: 40px 40px var(--space-8);
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-surface);
  }
  .login-card-head { text-align: center; margin-bottom: 28px; }
  .login-card-logo {
    width: 56px;
    height: 56px;
    margin: 0 auto var(--space-4);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border-radius: 14px;
    box-shadow: 0 0 0 1px rgba(16, 24, 40, .06), 0 1px 2px rgba(16, 24, 40, .06);
  }
  .login-card-logo img { width: 34px; height: 34px; object-fit: contain; display: block; }
  .login-card-eyebrow { margin: 0 0 var(--space-1); font: 500 13px/1.3 var(--font-sans); color: var(--ink-3); }
  .login-card h2 {
    margin: 0;
    font: 600 22px/1.25 var(--font-sans);
    letter-spacing: -.02em;
    color: var(--ink);
  }
  .login-card-sub { margin: 6px 0 0; font: 400 13.5px/1.4 var(--font-sans); color: var(--ink-3); }
  .login-card-sub [data-setor]:not(:empty)::before { content: '·'; margin: 0 6px; color: var(--ink-4); }

  .login-form { display: flex; flex-direction: column; gap: var(--space-4); }
  .login-form .ui-field input { height: 44px; font-size: 14px; }

  .login-erro {
    display: none;
    padding: var(--space-3) 14px;
    margin-bottom: var(--space-4);
    border-radius: var(--radius-md);
    background: var(--accent-50);
    color: var(--accent-text);
    font: 500 13px/1.4 var(--font-sans);
  }

  /* "Esqueci minha senha" — orientação sem nova funcionalidade */
  .login-esqueci { margin-top: calc(var(--space-2) * -1); text-align: right; }
  .login-esqueci summary {
    display: inline-block;
    list-style: none;
    cursor: pointer;
    font: 500 13px/1.3 var(--font-sans);
    color: var(--brand-text);
  }
  .login-esqueci summary::-webkit-details-marker { display: none; }
  .login-esqueci summary:hover { text-decoration: underline; }
  .login-esqueci summary:focus-visible { outline: none; border-radius: 4px; box-shadow: var(--ring); }
  .login-esqueci p {
    margin: var(--space-2) 0 0;
    padding: 10px var(--space-3);
    text-align: left;
    border-radius: var(--radius-md);
    background: var(--surface-sunken);
    font: 400 12.5px/1.45 var(--font-sans);
    color: var(--ink-2);
  }

  .login-form .login-submit { width: 100%; height: 44px; margin-top: var(--space-1); font-size: 14px; }

  /* ---------- Responsivo ---------- */
  @media (max-width: 1024px) {
    .login-panel { padding: var(--space-8) 48px; }
    .login-panel h1 { font-size: 34px; }
  }
  @media (max-width: 768px) {
    .login { grid-template-columns: 1fr; }
    .login-panel { display: none; }
    .login-side { padding: var(--space-6) var(--space-4); align-items: flex-start; padding-top: 12vh; }
    .login-card { max-width: none; padding: var(--space-8) var(--space-6) var(--space-6); }
  }
</style>
</head>
<body>
  <main class="login">
    <!-- Painel institucional -->
    <section class="login-panel" aria-hidden="true">
      <div class="login-panel-inner">
        <div class="login-panel-logo"><img src="/img/logo-full.png" alt="" /></div>
        <h1>Central de Atendimento</h1>
        <p class="login-panel-setor" data-setor></p>
        <hr class="login-panel-divider" />
        <p>Acesse sua conta para gerenciar atendimentos, acompanhar clientes e registrar conversas de forma segura.</p>
      </div>
    </section>

    <!-- Acesso -->
    <section class="login-side">
      <div class="login-card">
        <div class="login-card-head">
          <div class="login-card-logo"><img src="/img/logo-icon.png" alt="Grupo Santo Antônio" /></div>
          <p class="login-card-eyebrow">Bem-vindo</p>
          <h2 id="titulo-central">Central de Atendimento</h2>
          <p class="login-card-sub">Grupo Santo Antônio<span data-setor></span></p>
        </div>

        <div class="login-erro" id="erro" role="alert"></div>

        <form id="form-login" class="login-form">
          <label class="ui-field" for="login">
            <span>Usuário</span>
            <input type="text" id="login" autocomplete="username" required />
          </label>
          <label class="ui-field" for="senha">
            <span>Senha</span>
            <input type="password" id="senha" autocomplete="current-password" required />
          </label>
          <details class="login-esqueci">
            <summary>Esqueci minha senha</summary>
            <p>Peça ao administrador do sistema para redefinir sua senha em Configurações › Usuários.</p>
          </details>
          <button type="submit" class="ui-btn ui-btn--primary login-submit">Entrar</button>
        </form>

      </div>
    </section>
  </main>

<script>
  // Mostra em qual instalação a pessoa está entrando (Financeiro / Vendas),
  // já que as duas usam o mesmo logo. Só texto de tela: vem do SETOR do servidor.
  (async () => {
    try {
      const r = await fetch('/api/setor-atual');
      if (r.ok) {
        const s = await r.json();
        const nomes = { financeiro: 'Financeiro', vendas: 'Vendas', expedicao: 'Expedição' };
        const nome = (s && (nomes[s.slug] || s.nome)) || '';
        if (nome) document.querySelectorAll('[data-setor]').forEach((el) => { el.textContent = 'Atendimento ' + nome; });
      }
    } catch (e) { /* mantém os títulos sem o setor */ }
  })();

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const login = document.getElementById('login').value.trim();
    const senha = document.getElementById('senha').value;
    const erroEl = document.getElementById('erro');
    erroEl.style.display = 'none';

    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, senha }),
    });

    if (res.ok) {
      window.location.href = '/';
    } else {
      const data = await res.json().catch(() => ({}));
      erroEl.textContent = data.erro || 'Não foi possível entrar.';
      erroEl.style.display = 'block';
    }
  });
</script>
</body>
</html>
