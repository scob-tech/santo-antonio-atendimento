<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Entrar — Depósito Santo Antônio</title>
<meta name="theme-color" content="#2B3990" />
<link rel="icon" href="/img/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2B3990; --red:#E63329; --bg:#F1F2F5; --card:#FFFFFF;
    --text:#1F2430; --muted:#6B7280; --border:#E4E6EB; --green:#16A34A;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--card);width:100%;max-width:380px;border:1px solid var(--border);
    border-radius:16px;box-shadow:0 12px 40px rgba(30,40,70,.10);padding:34px 30px 30px}
  .brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:22px}
  .mark{width:64px;height:64px;border-radius:16px;background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;
    font-weight:700;font-size:26px;letter-spacing:1px;box-shadow:0 6px 16px rgba(43,57,144,.30)}
  .brand h1{font-family:'Oswald',sans-serif;font-size:19px;margin:0;color:var(--navy);
    text-transform:uppercase;letter-spacing:.5px;text-align:center;line-height:1.2}
  .brand p{margin:0;font-size:13px;color:var(--muted)}
  label{display:block;font-size:13px;font-weight:600;color:var(--text);margin:14px 0 6px}
  input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;
    font-size:15px;font-family:inherit;background:#fff;color:var(--text);outline:none;transition:border-color .15s}
  input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(43,57,144,.12)}
  button{width:100%;margin-top:22px;padding:13px;border:none;border-radius:10px;
    background:var(--navy);color:#fff;font-size:15px;font-weight:700;font-family:inherit;
    cursor:pointer;transition:filter .15s}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.65;cursor:default}
  .erro{margin-top:14px;background:#fdeceb;color:var(--red);border:1px solid #f6cfcc;
    border-radius:9px;padding:10px 12px;font-size:13.5px;display:none}
  .rodape{margin-top:20px;text-align:center;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
  <form class="card" id="form-login" autocomplete="on">
    <div class="brand">
      <div class="mark">SA</div>
      <h1>Depósito Santo Antônio</h1>
      <p>Central de Atendimento</p>
    </div>

    <label for="login">Usuário</label>
    <input id="login" name="login" type="text" autocomplete="username" autofocus required />

    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required />

    <button type="submit" id="btn-entrar">Entrar</button>
    <div class="erro" id="erro"></div>

    <div class="rodape">Depósito Santo Antônio · atendimento</div>
  </form>

<script>
  const form = document.getElementById('form-login');
  const erroEl = document.getElementById('erro');
  const btn = document.getElementById('btn-entrar');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erroEl.style.display = 'none';
    const login = document.getElementById('login').value.trim();
    const senha = document.getElementById('senha').value;
    if (!login || !senha) return;

    btn.disabled = true;
    btn.textContent = 'Entrando…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ login, senha }),
      });
      if (res.ok) {
        window.location.href = '/';
        return;
      }
      const dados = await res.json().catch(() => ({}));
      erroEl.textContent = dados.erro || 'Não foi possível entrar. Confira usuário e senha.';
      erroEl.style.display = 'block';
    } catch (err) {
      erroEl.textContent = 'Erro de conexão. Tente de novo em instantes.';
      erroEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
